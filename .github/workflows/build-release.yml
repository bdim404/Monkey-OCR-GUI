name: Build and Release

# Optimized workflow for releases with advanced caching and multi-platform support;
on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0;
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for manual release'
        required: false
        default: 'manual'

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: 'MonkeyOCR'

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    # Checkout with full history for proper version detection;
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Determine version from tag or input;
    - name: Determine version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "push") {
          $version = "${{ github.ref_name }}"
        } elseif ("${{ github.event.inputs.version }}" -ne "") {
          $version = "${{ github.event.inputs.version }}"
        } else {
          $version = "dev-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"

    # Set up Python with enhanced caching;
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    # Cache PyInstaller build files for faster subsequent builds;
    - name: Cache PyInstaller build
      uses: actions/cache@v4
      with:
        path: |
          build/
          __pycache__/
          **/__pycache__/
        key: pyinstaller-${{ runner.os }}-${{ hashFiles('monkey_ocr.spec', 'requirements.txt') }}
        restore-keys: |
          pyinstaller-${{ runner.os }}-

    # Install dependencies with retry mechanism;
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel

        # Retry pip install up to 3 times;
        $maxRetries = 3
        $retryCount = 0

        do {
          try {
            pip install -r requirements.txt --no-cache-dir
            echo "✅ Dependencies installed successfully"
            break
          } catch {
            $retryCount++
            if ($retryCount -ge $maxRetries) {
              throw "Failed to install dependencies after $maxRetries attempts"
            }
            echo "⚠️ Installation attempt $retryCount failed, retrying..."
            Start-Sleep -Seconds 10
          }
        } while ($retryCount -lt $maxRetries)

        # Display installed packages;
        pip list --format=columns

    # Validate project structure before building;
    - name: Validate project structure
      run: |
        $requiredFiles = @("main.py", "monkey_ocr.spec", "requirements.txt")

        foreach ($file in $requiredFiles) {
          if (-not (Test-Path $file)) {
            throw "Required file missing: $file"
          }
          echo "✅ Found: $file"
        }

        # Check if src directory exists;
        if (-not (Test-Path "src")) {
          throw "Source directory 'src' not found"
        }
        echo "✅ Project structure validated"

    # Build executable with detailed logging;
    - name: Build EXE with PyInstaller
      run: |
        echo "🔨 Starting PyInstaller build..."
        echo "Build timestamp: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')"

        # Clear previous builds;
        if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
        if (Test-Path "build") { Remove-Item -Recurse -Force "build" }

        # Run PyInstaller with verbose output;
        pyinstaller monkey_ocr.spec --clean --noconfirm --log-level INFO

        # Verify build results;
        if (Test-Path "dist/${{ env.APP_NAME }}.exe") {
          $fileInfo = Get-Item "dist/${{ env.APP_NAME }}.exe"
          $sizeKB = [math]::Round($fileInfo.Length / 1KB, 2)
          $sizeMB = [math]::Round($fileInfo.Length / 1MB, 2)

          echo "✅ Build successful!"
          echo "📦 Executable: $($fileInfo.Name)"
          echo "📏 Size: $sizeKB KB ($sizeMB MB)"
          echo "📅 Created: $($fileInfo.CreationTime)"

          # Test if executable can be loaded;
          try {
            $process = Start-Process -FilePath "dist/${{ env.APP_NAME }}.exe" -ArgumentList "--version" -NoNewWindow -PassThru -Wait -ErrorAction SilentlyContinue
            if ($process.ExitCode -eq 0) {
              echo "✅ Executable validation passed"
            } else {
              echo "⚠️ Executable validation inconclusive (exit code: $($process.ExitCode))"
            }
          } catch {
            echo "⚠️ Could not validate executable (expected for GUI apps)"
          }
        } else {
          echo "❌ Build failed - executable not found"
          echo "Build directory contents:"
          if (Test-Path "dist") { Get-ChildItem "dist" -Recurse }
          exit 1
        }

    # Create versioned artifact;
    - name: Prepare release artifact
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $artifactName = "${{ env.APP_NAME }}-$version-windows-x64.exe"

        Copy-Item "dist/${{ env.APP_NAME }}.exe" $artifactName

        echo "📋 Artifact prepared: $artifactName"
        echo "artifact-name=$artifactName" >> $env:GITHUB_OUTPUT

    # Upload versioned artifact;
    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-windows-x64
        path: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-windows-x64.exe
        retention-days: 90

    # Create GitHub release for tagged builds;
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-windows-x64.exe
        name: ${{ env.APP_NAME }} ${{ steps.version.outputs.version }}
        tag_name: ${{ steps.version.outputs.version }}
        body: |
          ## ${{ env.APP_NAME }} ${{ steps.version.outputs.version }}

          ### 📦 Downloads
          - **Windows (x64)**: `${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-windows-x64.exe`

          ### 🚀 Installation
          1. Download the executable file
          2. Run `${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-windows-x64.exe`
          3. No additional installation required

          ### 📋 System Requirements
          - Windows 10/11 (x64)
          - No Python installation required

          ---
          *Built with GitHub Actions on $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')*
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, 'pre') || contains(steps.version.outputs.version, 'rc') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notification job (optional);
  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: build-windows
    if: always()

    steps:
    - name: Build Status Summary
      run: |
        echo "🏗️ Build Status Summary"
        echo "Version: ${{ needs.build-windows.outputs.version }}"
        echo "Status: ${{ needs.build-windows.result }}"

        if [ "${{ needs.build-windows.result }}" == "success" ]; then
          echo "✅ Build completed successfully"
        else
          echo "❌ Build failed"
        fi