name: Build Windows EXE (Development)

# Development build workflow - excludes main branch to avoid conflicts with auto-release;
on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - develop
      - feature/**
      - fix/**
      - hotfix/**
  workflow_dispatch:  # Allow manual triggering;

# Environment variables;
env:
  PYTHON_VERSION: '3.11'

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
    # Checkout the repository;
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up Python environment;
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'  # Cache pip dependencies;

    # Display Python version for debugging;
    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    # Install dependencies from requirements.txt;
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip list  # Show installed packages for debugging;

    # Verify PyInstaller installation;
    - name: Verify PyInstaller
      run: pyinstaller --version

    # Build executable using existing spec file;
    - name: Build EXE with PyInstaller
      run: |
        echo "Building executable using monkey_ocr.spec..."
        pyinstaller monkey_ocr.spec --clean --noconfirm

        # Verify the executable was created;
        if (Test-Path "dist/MonkeyOCR.exe") {
          echo "✅ Executable built successfully"
          Get-Item "dist/MonkeyOCR.exe" | Select-Object Name, Length
        } else {
          echo "❌ Executable not found"
          exit 1
        }

    # Test the executable (basic smoke test);
    - name: Test executable
      run: |
        echo "Testing executable..."
        # Run with --version or --help if available, otherwise just check if it starts;
        # For GUI applications, we can't run them fully in CI;
        if (Test-Path "dist/MonkeyOCR.exe") {
          echo "Executable exists and is ready for distribution"
        }

    # Upload the built executable as artifact for development testing;
    - name: Upload Development Build
      uses: actions/upload-artifact@v4
      with:
        name: MonkeyOCR-dev-${{ github.run_number }}-windows-x64
        path: dist/MonkeyOCR.exe
        retention-days: 7  # Shorter retention for dev builds;